server:
  port: 8080
  # A file named production.yaml must not boot in development mode: it enables
  # verbose errors and relaxed security. Flip this back only for local runs of
  # the production config.
  development: false
  database:
    # Replace with your real database host when PostgreSQL does not run on the
    # same machine (managed service, container, etc.).
    host: localhost
    port: 5432
    user: postgres
    # Set your own password via environment variable or a local config file.
    # Example: export SERVERPOD_DATABASE_PASSWORD=your_secret_here
    password: ${DB_PASSWORD}
    database: gather

migrations:
  applyRepairMigration: false
  applyMigrations: true

endpoints:
  - gatherEndpoint

auth:
  email:
    enabled: true
    allowUnverified: false

streaming:
  enabled: true

scheduledTasks:
  enabled: true
