server:
  port: 8080
  development: true
  database:
    host: localhost
    port: 5432
    user: postgres
    # Set your own password via environment variable or a local config file.
    # Example: export SERVERPOD_DATABASE_PASSWORD=your_secret_here
    password: ${DB_PASSWORD}
    database: gather

migrations:
  applyRepairMigration: false
  applyMigrations: true

endpoints:
  - gatherEndpoint

auth:
  email:
    enabled: true
    allowUnverified: false

streaming:
  enabled: true

scheduledTasks:
  enabled: true
